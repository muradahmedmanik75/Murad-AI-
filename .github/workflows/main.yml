name: Build Murad AI Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Murad AI project
        run: |
          test -f murad-ai-project.zip
          mkdir -p extracted
          unzip -q murad-ai-project.zip -d extracted
          ANDROID_DIR=$(find extracted -type f -path '*/android-native/settings.gradle.kts' -print -quit | xargs dirname)
          if [ -z "$ANDROID_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          gradle -p "$ANDROID_DIR" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MuradAI-OPPO-A18-APK
          path: extracted/**/android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
